name: Build and Push All Services

on:
  push:
    branches: [ ci_cd_pipeline_setup, main ]
    paths:
      - 'services/**'
  workflow_dispatch:

env:
  REGISTRY: docker.io
  DOCKERHUB_USERNAME: nuwan1998
  DOCKERHUB_REPO: nuwan1998/cca-salary-submition

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.filter.outputs.changes }}
      image_tag: ${{ steps.tag.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag
        id: tag
        run: echo "value=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Detect changed services
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            bff:
              - 'services/bff/**'
            frontend:
              - 'services/frontend/**'
            identity:
              - 'services/identity/**'
            salary-submission:
              - 'services/salary-submission/**'
            search:
              - 'services/search/**'
            stats:
              - 'services/stats/**'
            vote:
              - 'services/vote/**'

  build-and-push:
    name: Build & Push - ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.services != '[]' }}

    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tag
        id: tag
        run: echo "value=$(date +'%Y%m%d%H%M')" >> $GITHUB_OUTPUT

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ env.DOCKERHUB_REPO }}:${{ matrix.service }}-${{ needs.detect-changes.outputs.image_tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to MicroK8s (EC2)
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: ${{ needs.detect-changes.outputs.services != '[]' && github.event_name != 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig via K8s API token
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CA_CERT }}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster microk8s \
            --server=${{ secrets.KUBE_API_SERVER }} \
            --certificate-authority=/tmp/ca.crt
          kubectl config set-credentials github-actions \
            --token=${{ secrets.KUBE_TOKEN }}
          kubectl config set-context microk8s \
            --cluster=microk8s \
            --user=github-actions \
            --namespace=app
          kubectl config use-context microk8s

      - name: Verify cluster connection
        run: kubectl get nodes

      - name: Apply app deployments
        run: kubectl apply -f k8s/app/

      - name: Update image tags and deploy
        run: |
          SERVICES="${{ join(fromJson(needs.detect-changes.outputs.services), ' ') }}"
          TAG="${{ needs.detect-changes.outputs.image_tag }}"
          for svc in $SERVICES; do
            echo "Updating $svc to tag $TAG"
            kubectl set image deployment/$svc \
              $svc=${{ env.DOCKERHUB_REPO }}:${svc}-${TAG} \
              -n app
          done

      - name: Wait for rollouts
        run: |
          SERVICES="${{ join(fromJson(needs.detect-changes.outputs.services), ' ') }}"
          for svc in $SERVICES; do
            kubectl rollout status deployment/$svc -n app --timeout=120s
          done
