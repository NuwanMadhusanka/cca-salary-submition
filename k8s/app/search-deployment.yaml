apiVersion: apps/v1
kind: Deployment
metadata:
  name: search
  namespace: app
  labels:
    app: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app: search
  template:
    metadata:
      labels:
        app: search
    spec:
      containers:
        - name: search
          image: techsalaryacr.azurecr.io/search:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          env:
            - name: PORT
              value: "8084"
            - name: NODE_ENV
              value: production
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: search
  namespace: app
spec:
  type: ClusterIP
  selector:
    app: search
  ports:
    - port: 8084
      targetPort: 8084
