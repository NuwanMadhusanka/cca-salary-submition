---
# github-actions-sa.yaml
# ServiceAccount for GitHub Actions to deploy to the 'app' namespace
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-actions
  namespace: app
---
# Gives the ServiceAccount permission to manage deployments, pods, and services in 'app' namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-deployer
  namespace: app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
# Binds the Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deployer-binding
  namespace: app
subjects:
  - kind: ServiceAccount
    name: github-actions
    namespace: app
roleRef:
  kind: Role
  name: github-actions-deployer
  apiVersion: rbac.authorization.k8s.io/v1