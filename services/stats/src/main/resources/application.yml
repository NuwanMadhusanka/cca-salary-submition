spring:
  application:
    name: stats-service

  datasource:
    url: jdbc:postgresql://${DATABASE_HOST:salary-transparency-db.postgres.database.azure.com}:${DATABASE_PORT:5432}/${DATABASE_NAME:postgres}
    username: ${DATABASE_USER:test}
    password: ${DATABASE_PASSWORD:test}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: ${SHOW_SQL:false}
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: salary-submissions
        format_sql: true

server:
  port: ${SERVICE_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
      base-path: /api/actuator
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /api/api-docs
  swagger-ui:
    path: /api/swagger-ui.html
    operations-sorter: method

logging:
  level:
    root: INFO
    com.salary.transparency: ${LOG_LEVEL:INFO}
